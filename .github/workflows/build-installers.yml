name: Build Paintram installers

# Builds the finished installers for Windows and Linux: program + AI models in ONE package, no source code.
#   Actions > "Build Paintram installers" > Run workflow     (or push a tag such as v2.1.0)
# The installers are uploaded as workflow artifacts. They are several GB each, so share them from your own
# storage or website (GitHub release assets are limited to 2 GiB per file).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/hopeful-newton-ge1ite"]     # also builds on every push to the working branch

env:
  QT_QPA_PLATFORM: offscreen
  PIP_NO_CACHE_DIR: "1"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: pip install -r requirements.txt pillow
      - name: Tests (editor, shape recognition, AI panel)
        run: python -m unittest discover -s tests

  linux:
    needs: test
    runs-on: ubuntu-22.04              # old glibc: the result runs on most current distributions
    steps:
      - name: Free disk space (the bundle with torch + models is large)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Python dependencies (CUDA build of torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu128
          pip install -r requirements-ai.txt pyinstaller cython setuptools
      - name: Full test suite including the real AI engine
        run: python -m unittest discover -s tests
      - name: Build installer
        run: python packaging/build.py
      - name: Checksums
        run: cd build/installer && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Paintram-linux
          path: build/installer/*
          compression-level: 0

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependencies (CUDA build of torch)
        shell: bash
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu128
          pip install -r requirements-ai.txt pyinstaller cython setuptools
      - name: Microsoft Visual C++ runtime (current PyTorch fails to load c10.dll without a recent one)
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
          Start-Process .\vc_redist.x64.exe -ArgumentList '/install','/quiet','/norestart' -Wait
          python -c "import torch; print('torch', torch.__version__, 'imports fine')"
      - name: Full test suite including the real AI engine
        shell: bash
        run: python -m unittest discover -s tests
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: python packaging/build.py
      - name: Checksums
        shell: bash
        run: cd build/installer && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Paintram-windows
          path: build/installer/*
          compression-level: 0
